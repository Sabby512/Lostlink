<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password – UCLM LostLink</title>
<style>
:root{--bg:#e9f1ef;--ink:#14284b;--muted:#3f4d66;--card:#fff;--amber:#f5a623;--field:#f3f6fa;--line:#d5deea;--nav:#ffffffee}
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* NAV (same as home page) */
.nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 28px;background:var(--nav);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(20,40,75,.08)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);line-height:1.15}
.brand strong{font-size:20px}
.brand small{display:block;font-size:14px;color:var(--muted)}
.logo{width:50px;height:50px;border-radius:10px;background:#fff url(logo.png) center/82% no-repeat;box-shadow:inset 0 0 0 1.5px #d5deea}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;border:1.5px solid var(--ink);text-decoration:none;display:inline-block;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,40,75,.2)}
.ghost{background:transparent;color:var(--ink)}
.amber{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.solid{background:var(--ink);border-color:var(--ink);color:#fff}


/* CARD */
.wrap{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 72px);padding:40px 20px}
.card{width:100%;max-width:460px;background:var(--card);border-radius:18px;padding:40px 40px 34px;box-shadow:0 8px 30px rgba(20,40,75,.1)}
.card h1{font-size:28px;letter-spacing:-.01em}
.card .sub{font-size:15px;line-height:1.5;color:#6b7891;margin-top:12px}
form{margin-top:24px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:14px;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#8b97ab}
input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.3)}
input.bad{border-color:#d64545}
.submit{width:100%;margin-top:6px;padding:15px;border-radius:10px;border:0;background:var(--amber);color:var(--ink);font-size:15px;font-weight:800;transition:transform .2s,box-shadow .2s}
.submit:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(245,166,35,.45)}
.msg{min-height:18px;margin:10px 0 8px;font-size:13px;font-weight:600;text-align:center}
.msg.err{color:#d64545}
.msg.ok{color:#1c7c4d}
.back{display:block;text-align:center;margin-top:18px;font-size:14px;font-weight:800;color:var(--ink);text-decoration:none}
.back:hover{text-decoration:underline}
@media(max-width:860px){
  .nav{padding:10px 20px}
  .brand small{display:none}
  .btn{padding:9px 16px;font-size:13px}
  .card{padding:30px 22px 26px}
}
</style>
</head>
<body>
<header class="nav">
  <a href="index.html" class="brand">
    <span class="logo"></span>
    <span><strong>UCLM LostLink</strong><small>Campus Lost and Found</small></span>
  </a>
  <div class="actions">
    <a href="login.html" class="btn ghost">Log in</a>
    <a href="signup.html" class="btn amber">Sign up</a>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h1>Reset your password</h1>
    <p class="sub">Enter your school email and we’ll send a reset link.</p>
    <form id="reset" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@gmail.com" autocomplete="email">
      <p class="msg" id="msg" aria-live="polite"></p>
      <button class="submit" type="submit">Send reset link</button>
    </form>
    <a class="back" href="login.html">Back to log in</a>
  </section>
</main>

<script>
const f=document.getElementById('reset'),em=document.getElementById('email'),msg=document.getElementById('msg');
function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err')}
f.addEventListener('submit',e=>{
  e.preventDefault();
  em.classList.remove('bad');
  if(!/^\S+@\S+\.\S+$/.test(em.value.trim())){em.classList.add('bad');em.focus();return show('Enter a valid school email.')}
  const btn=f.querySelector('.submit');btn.disabled=true;
  fetch('api/auth.php?action=forgot',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({email:em.value.trim()})})
    .then(r=>r.json().then(d=>({ok:r.ok,d})))
    .then(({ok,d})=>show(ok?'If that email is registered, a reset link is on its way.':(d.error||'Something went wrong.'),ok))
    .catch(()=>show('Cannot reach the server. Please check your connection and try again.'))
    .finally(()=>{btn.disabled=false});
});
</script>
</body>
</html>
